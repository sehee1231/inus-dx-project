<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닥 — 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-entry-gate.js"></script>
  <script src="supabase-auth.js"></script>
  <style>
    body { font-feature-settings: "ss01" on; }
  </style>
</head>
<body class="min-h-screen bg-[#0c0c0e] text-zinc-100 antialiased">
  <main class="mx-auto w-full max-w-6xl px-4 py-8">
    <header class="mb-6 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">관리자 페이지</h1>
        <p id="admin-sub" class="mt-1 text-sm text-zinc-400">권한 확인 중...</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="project.html" class="rounded-lg border border-zinc-700 px-3 py-2 text-sm hover:bg-zinc-800">피드로</a>
        <button id="btn-logout" type="button" class="rounded-lg border border-zinc-700 px-3 py-2 text-sm hover:bg-zinc-800">로그아웃</button>
      </div>
    </header>

    <section class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
      <article class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <p class="text-xs text-zinc-500">총 사용자</p>
        <p id="stat-users" class="mt-2 text-2xl font-semibold">-</p>
      </article>
      <article class="rounded-xl border border-amber-900/40 bg-zinc-900/60 p-4">
        <p class="text-xs text-amber-200/80">승인 대기</p>
        <p id="stat-pending" class="mt-2 text-2xl font-semibold text-amber-100">-</p>
      </article>
      <article class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <p class="text-xs text-zinc-500">총 게시글</p>
        <p id="stat-posts" class="mt-2 text-2xl font-semibold">-</p>
      </article>
      <article class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <p class="text-xs text-zinc-500">미확인 알림</p>
        <p id="stat-unread" class="mt-2 text-2xl font-semibold">-</p>
      </article>
      <article class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
        <p class="text-xs text-zinc-500">메일 큐(queued)</p>
        <p id="stat-mail" class="mt-2 text-2xl font-semibold">-</p>
      </article>
    </section>

    <section class="mb-6 rounded-xl border border-zinc-800 bg-zinc-900/50 p-4">
      <h2 class="mb-3 text-lg font-semibold">사용자 관리</h2>
      <div id="users-wrap" class="overflow-x-auto text-sm"></div>
    </section>

    <section class="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4">
      <h2 class="mb-3 text-lg font-semibold">게시글 관리</h2>
      <div id="posts-wrap" class="overflow-x-auto text-sm"></div>
    </section>
  </main>

  <script>
    (async function () {
      function ph(name) {
        return window.MoaSiteEntry && window.MoaSiteEntry.pageHref
          ? window.MoaSiteEntry.pageHref(name)
          : name;
      }
      function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      }
      function isMissingApprovalStatusError(err) {
        var msg = err && err.message ? String(err.message) : '';
        return msg.indexOf('approval_status') !== -1;
      }
      function isUndefinedTableError(err) {
        var msg = err && err.message ? String(err.message) : '';
        return msg.indexOf('does not exist') !== -1 || msg.indexOf('relation') !== -1;
      }
      function errMsg(err) {
        return err && err.message ? String(err.message) : String(err || 'unknown error');
      }
      var subEl = document.getElementById('admin-sub');
      var usersWrap = document.getElementById('users-wrap');
      var postsWrap = document.getElementById('posts-wrap');
      var statUsers = document.getElementById('stat-users');
      var statPending = document.getElementById('stat-pending');
      var statPosts = document.getElementById('stat-posts');
      var statUnread = document.getElementById('stat-unread');
      var statMail = document.getElementById('stat-mail');

      document.getElementById('btn-logout').addEventListener('click', async function () {
        if (window.MoaAuth && window.MoaAuth.signOut) await window.MoaAuth.signOut();
        location.replace(ph('login.html'));
      });

      try {
        if (!window.MoaAuth || !window.MoaAuth.requireAuth || !window.MoaAuth.getClient) {
          throw new Error('인증 스크립트를 불러오지 못했습니다.');
        }
        var user = await window.MoaAuth.requireAuth();
        if (!user) return;
        var myProfile = await window.MoaAuth.getMyProfile();
        if (!myProfile || myProfile.role !== 'admin' || (typeof window.MoaAuth.isProfileApproved === 'function' && !window.MoaAuth.isProfileApproved(myProfile))) {
          var uid = user.id || '';
          var proj = window.MoaAuth.projectUrl || '';
          var hint = !myProfile
            ? 'profiles 테이블에 이 계정 행이 없을 수 있습니다. 방금 로그인 시 자동 생성되었는지 확인하거나, 아래 UUID로 Supabase에서 insert/upsert 하세요.'
            : ('현재 role은 "' + String(myProfile.role) + '" 입니다. SQL에서 이 UUID의 role을 정확히 admin(소문자)으로 저장했는지, 그리고 프로젝트가 앱과 동일한지 확인하세요.');
          subEl.textContent = '관리자만 접근할 수 있습니다. ' + hint + ' UUID: ' + uid;
          alert(
            '관리자 권한이 필요합니다.\n\n' + hint +
            '\n\n로그인 UUID:\n' + uid +
            (proj ? '\n\n앱에 연결된 Supabase:\n' + proj : '')
          );
          location.replace(ph('project.html'));
          return;
        }
        subEl.textContent = '관리 권한 확인 완료';
        var c = window.MoaAuth.getClient();
        var warns = [];

        var hasApprovalColumn = true;
        var usersRes = await c.from('profiles').select('id,username,display_name,role,approval_status,created_at').order('created_at', { ascending: false }).limit(200);
        if (usersRes.error && isMissingApprovalStatusError(usersRes.error)) {
          hasApprovalColumn = false;
          usersRes = await c.from('profiles').select('id,username,display_name,role,created_at').order('created_at', { ascending: false }).limit(200);
          if (usersRes.error) {
            warns.push('profiles 조회 실패: ' + errMsg(usersRes.error));
            usersRes = { data: [] };
          }
        } else if (usersRes.error) {
          warns.push('profiles 조회 실패: ' + errMsg(usersRes.error));
          usersRes = { data: [] };
        }
        var users = usersRes.data || [];
        statUsers.textContent = String(users.length);
        var nPending = hasApprovalColumn
          ? users.filter(function (x) { return (x.approval_status || 'pending') === 'pending'; }).length
          : 0;
        statPending.textContent = String(nPending);

        usersWrap.innerHTML = [
          '<table class="min-w-full">',
          '<thead><tr class="border-b border-zinc-800 text-left text-zinc-400"><th class="p-2">username</th><th class="p-2">display</th><th class="p-2">role</th><th class="p-2">승인</th><th class="p-2">action</th></tr></thead>',
          '<tbody>',
          users.map(function (u) {
            var ap = hasApprovalColumn ? (u.approval_status || 'pending') : 'approved';
            var apClass = ap === 'approved' ? 'bg-emerald-900/50 text-emerald-200' : ap === 'rejected' ? 'bg-rose-900/40 text-rose-200' : 'bg-amber-900/40 text-amber-100';
            var actions = [
              '<button type="button" data-user-id="' + esc(u.id) + '" data-role="' + esc(u.role || 'user') + '" class="btn-role rounded border border-zinc-700 px-2 py-1 text-xs hover:bg-zinc-800">권한</button>'
            ];
            if (hasApprovalColumn && ap !== 'approved') {
              actions.push('<button type="button" data-user-id="' + esc(u.id) + '" class="btn-approve ml-1 rounded border border-emerald-800 px-2 py-1 text-xs text-emerald-300 hover:bg-emerald-950/40">승인</button>');
            }
            if (hasApprovalColumn && ap !== 'rejected') {
              actions.push('<button type="button" data-user-id="' + esc(u.id) + '" class="btn-reject ml-1 rounded border border-rose-800 px-2 py-1 text-xs text-rose-300 hover:bg-rose-950/30">거절</button>');
            }
            return '<tr class="border-b border-zinc-900">' +
              '<td class="p-2">' + esc(u.username || '-') + '</td>' +
              '<td class="p-2">' + esc(u.display_name || '-') + '</td>' +
              '<td class="p-2"><span class="rounded bg-zinc-800 px-2 py-1 text-xs">' + esc(u.role || 'user') + '</span></td>' +
              '<td class="p-2"><span class="rounded px-2 py-1 text-xs ' + apClass + '">' + esc(ap) + '</span></td>' +
              '<td class="p-2 whitespace-nowrap">' + actions.join('') + '</td>' +
              '</tr>';
          }).join(''),
          '</tbody></table>'
        ].join('');

        var postsRes = await c.from('posts').select('slug,title,author_name,created_at,visibility').order('created_at', { ascending: false }).limit(200);
        var posts = [];
        if (!postsRes.error) {
          posts = postsRes.data || [];
        } else if (!isUndefinedTableError(postsRes.error)) {
          warns.push('posts 조회 실패: ' + errMsg(postsRes.error));
        } else {
          warns.push('posts 테이블 없음(초기화 필요)');
        }
        statPosts.textContent = String(posts.length);
        postsWrap.innerHTML = posts.length
          ? [
              '<table class="min-w-full">',
              '<thead><tr class="border-b border-zinc-800 text-left text-zinc-400"><th class="p-2">title</th><th class="p-2">author</th><th class="p-2">visibility</th><th class="p-2">action</th></tr></thead>',
              '<tbody>',
              posts.map(function (p) {
                return '<tr class="border-b border-zinc-900">' +
                  '<td class="p-2"><a class="hover:underline" href="post-detail.html?slug=' + encodeURIComponent(p.slug) + '">' + esc(p.title || p.slug) + '</a></td>' +
                  '<td class="p-2">' + esc(p.author_name || '-') + '</td>' +
                  '<td class="p-2">' + esc(p.visibility || 'public') + '</td>' +
                  '<td class="p-2"><button data-post-slug="' + esc(p.slug) + '" class="btn-del rounded border border-rose-800 px-2 py-1 text-xs text-rose-300 hover:bg-rose-950/30">삭제</button></td>' +
                  '</tr>';
              }).join(''),
              '</tbody></table>'
            ].join('')
          : '<p class="p-2 text-zinc-500">게시글 데이터가 없거나 posts 테이블이 아직 준비되지 않았습니다.</p>';

        var unreadRes = await c.from('notifications').select('id', { count: 'exact', head: true }).eq('read', false);
        if (unreadRes.error) warns.push('notifications 조회 실패: ' + errMsg(unreadRes.error));
        statUnread.textContent = unreadRes.error ? '0' : String(unreadRes.count || 0);
        var mailRes = await c.from('email_jobs').select('id', { count: 'exact', head: true }).eq('status', 'queued');
        if (mailRes.error) warns.push('email_jobs 조회 실패: ' + errMsg(mailRes.error));
        statMail.textContent = mailRes.error ? '0' : String(mailRes.count || 0);
        if (warns.length) {
          subEl.textContent = '일부 데이터 조회 실패: ' + warns.join(' | ');
        }

        usersWrap.addEventListener('click', async function (e) {
          if (!hasApprovalColumn) {
            var maybeRole = e.target.closest('.btn-role');
            if (!maybeRole) return;
          }
          var approveBtn = e.target.closest('.btn-approve');
          if (approveBtn) {
            var aid = approveBtn.getAttribute('data-user-id');
            if (!aid || !confirm('이 회원을 승인할까요?')) return;
            var ap = await c.from('profiles').update({ approval_status: 'approved' }).eq('id', aid);
            if (ap.error) return alert('승인 실패: ' + ap.error.message);
            location.reload();
            return;
          }
          var rejectBtn = e.target.closest('.btn-reject');
          if (rejectBtn) {
            var rid = rejectBtn.getAttribute('data-user-id');
            if (!rid || rid === user.id) return alert('본인 계정은 거절할 수 없습니다.');
            if (!confirm('이 회원을 거절할까요? 로그인은 되지만 서비스를 쓸 수 없게 됩니다.')) return;
            var rj = await c.from('profiles').update({ approval_status: 'rejected' }).eq('id', rid);
            if (rj.error) return alert('거절 처리 실패: ' + rj.error.message);
            location.reload();
            return;
          }
          var btn = e.target.closest('.btn-role');
          if (!btn) return;
          var userId = btn.getAttribute('data-user-id');
          var current = btn.getAttribute('data-role') || 'user';
          var next = current === 'admin' ? 'user' : 'admin';
          var ok = confirm('해당 사용자를 ' + next + ' 권한으로 변경할까요?');
          if (!ok) return;
          var patch = { role: next };
          if (hasApprovalColumn && next === 'admin') patch.approval_status = 'approved';
          var up = await c.from('profiles').update(patch).eq('id', userId);
          if (up.error) return alert('권한 변경 실패: ' + up.error.message);
          location.reload();
        });

        postsWrap.addEventListener('click', async function (e) {
          var btn = e.target.closest('.btn-del');
          if (!btn) return;
          var slug = btn.getAttribute('data-post-slug');
          if (!slug || !confirm('게시글을 삭제할까요?')) return;
          var del = await c.from('posts').delete().eq('slug', slug);
          if (del.error) return alert('삭제 실패: ' + del.error.message);
          location.reload();
        });
      } catch (e) {
        var em = e && e.message ? String(e.message) : String(e || 'unknown error');
        subEl.textContent = '관리자 데이터를 불러오지 못했습니다: ' + em;
        console.error('[ADMIN] failed:', em);
      }
    })();
  </script>
</body>
</html>
