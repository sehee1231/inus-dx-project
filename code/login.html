<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닥 — 로그인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-entry-gate.js"></script>
  <script src="supabase-auth.js"></script>
</head>
<body class="min-h-screen bg-[#0c0c0e] text-zinc-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-md items-center px-4 py-10">
    <section class="w-full rounded-2xl border border-zinc-800/90 bg-zinc-900/60 p-6 shadow-xl shadow-black/30 ring-1 ring-white/[0.04]">
      <h1 class="text-xl font-bold tracking-tight">모닥 로그인</h1>
      <p class="mt-1 text-sm text-zinc-400">이메일과 비밀번호로 로그인해 주세요.</p>

      <form id="auth-form" class="mt-6 space-y-3" onsubmit="return false;">
        <label class="block">
          <span class="mb-1 block text-2xs text-zinc-500">이메일</span>
          <input id="in-email" type="email" required autocomplete="username" placeholder="you@example.com" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-sky-500/70" />
        </label>
        <label class="block">
          <span class="mb-1 block text-2xs text-zinc-500">비밀번호</span>
          <input id="in-password" type="password" required minlength="6" autocomplete="current-password" placeholder="비밀번호" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-sky-500/70" />
        </label>
        <button id="btn-login" type="button" class="mt-2 w-full rounded-lg bg-sky-600 py-2.5 text-sm font-semibold text-white hover:bg-sky-500">로그인</button>
      </form>
      <p id="auth-msg" class="mt-3 min-h-[1.25rem] text-xs text-zinc-400"></p>
      <p class="mt-4 text-center text-sm text-zinc-500">
        계정이 없으신가요?
        <a href="signup.html" class="font-medium text-sky-400 hover:text-sky-300">회원가입</a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var next = window.MoaAuth.normalizeNextPath(params.get('next'));
      var emailEl = document.getElementById('in-email');
      var passEl = document.getElementById('in-password');
      var msgEl = document.getElementById('auth-msg');
      var c = window.MoaAuth.getClient();

      function msg(t, isErr) {
        msgEl.textContent = t || '';
        msgEl.className = 'mt-3 min-h-[1.25rem] text-xs ' + (isErr ? 'text-rose-400' : 'text-zinc-400');
      }

      function goNext() {
        location.replace(next);
      }

      async function login() {
        msg('로그인 중...');
        var res = await c.auth.signInWithPassword({
          email: String(emailEl.value || '').trim(),
          password: String(passEl.value || ''),
        });
        if (res.error) throw new Error(res.error.message);
        var user = res.data && res.data.user;
        if (user && window.MoaAuth.ensureProfileRowIfMissing) {
          await window.MoaAuth.ensureProfileRowIfMissing(user);
        }
        if (window.MoaSiteEntry && window.MoaSiteEntry.markEnteredAfterAuth) {
          window.MoaSiteEntry.markEnteredAfterAuth();
        }
        msg('로그인 성공');
        goNext();
      }

      document.getElementById('btn-login').addEventListener('click', function () {
        login().catch(function (e) { msg(e.message || '로그인 실패', true); });
      });

      window.MoaAuth.getSessionUser().then(function (u) {
        if (!u) return;
        if (u.is_anonymous) {
          window.MoaAuth.signOut().catch(function () {});
          return;
        }
        if (window.MoaSiteEntry && window.MoaSiteEntry.markEnteredAfterAuth) {
          window.MoaSiteEntry.markEnteredAfterAuth();
        }
        window.MoaAuth.getMyProfile().then(function (p) {
          if (window.MoaAuth.isProfileApproved && window.MoaAuth.isProfileApproved(p)) {
            goNext();
            return;
          }
          if (p && p.approval_status === 'rejected') {
            location.replace(
              (window.MoaSiteEntry && window.MoaSiteEntry.pageHref
                ? window.MoaSiteEntry.pageHref('pending-approval.html')
                : 'pending-approval.html') + '?reason=rejected'
            );
            return;
          }
          location.replace(
            window.MoaSiteEntry && window.MoaSiteEntry.pageHref
              ? window.MoaSiteEntry.pageHref('pending-approval.html')
              : 'pending-approval.html'
          );
        }).catch(function () { goNext(); });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
