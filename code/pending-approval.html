<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닥 — 승인 대기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-entry-gate.js"></script>
  <script src="supabase-auth.js"></script>
</head>
<body class="min-h-screen bg-[#0c0c0e] text-zinc-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-4 py-10">
    <section class="rounded-2xl border border-zinc-800/90 bg-zinc-900/60 p-6 shadow-xl shadow-black/30 ring-1 ring-white/[0.04]">
      <h1 class="text-xl font-bold tracking-tight" id="title-el">승인 대기 중</h1>
      <p class="mt-3 text-sm leading-relaxed text-zinc-400" id="msg-el">
        관리자가 회원 가입을 확인한 뒤 피드와 글쓰기를 이용할 수 있어요. 승인되면 아래 버튼으로 들어가 보세요.
      </p>
      <p id="email-el" class="mt-2 truncate text-xs text-zinc-500"></p>
      <div class="mt-6 flex flex-col gap-2 sm:flex-row">
        <button id="btn-enter" type="button" class="rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-500">다시 확인하고 들어가기</button>
        <button id="btn-out" type="button" class="rounded-lg border border-zinc-700 px-4 py-2.5 text-sm text-zinc-200 hover:bg-zinc-800">로그아웃</button>
      </div>
      <p class="mt-5 text-center text-sm text-zinc-500">
        <a href="login.html" class="text-sky-400 hover:text-sky-300">다른 계정으로 로그인</a>
        <span class="text-zinc-700"> · </span>
        <a href="signup.html" class="text-zinc-400 hover:text-zinc-300">새로 가입</a>
      </p>
    </section>
  </main>
  <script>
    (async function () {
      function ph(name) {
        return window.MoaSiteEntry && window.MoaSiteEntry.pageHref
          ? window.MoaSiteEntry.pageHref(name)
          : name;
      }
      var titleEl = document.getElementById('title-el');
      var msgEl = document.getElementById('msg-el');
      var emailEl = document.getElementById('email-el');
      var params = new URLSearchParams(location.search);
      if (params.get('reason') === 'rejected') {
        titleEl.textContent = '가입이 거절되었습니다';
        msgEl.textContent = '이 계정으로는 서비스를 이용할 수 없어요. 관리자에게 문의하거나 다른 계정으로 가입해 주세요.';
      }
      var user = await window.MoaAuth.requireAuth();
      if (!user) return;
      emailEl.textContent = user.email ? String(user.email) : '';

      async function tryEnter() {
        var p = await window.MoaAuth.getMyProfile();
        if (window.MoaAuth.isProfileApproved && window.MoaAuth.isProfileApproved(p)) {
          location.replace(ph('project.html'));
          return;
        }
        alert('아직 승인되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      }

      document.getElementById('btn-enter').addEventListener('click', function () {
        tryEnter().catch(function (e) { alert(e.message || '확인 실패'); });
      });
      document.getElementById('btn-out').addEventListener('click', async function () {
        if (window.MoaAuth.signOut) await window.MoaAuth.signOut();
        location.replace(ph('login.html'));
      });

      var initial = await window.MoaAuth.getMyProfile();
      if (window.MoaAuth.isProfileApproved && window.MoaAuth.isProfileApproved(initial)) {
        location.replace(ph('project.html'));
      }
    })();
  </script>
</body>
</html>
