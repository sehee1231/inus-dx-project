<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닥 — 회원가입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-entry-gate.js"></script>
  <script src="supabase-auth.js"></script>
</head>
<body class="min-h-screen bg-[#0c0c0e] text-zinc-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-4 py-10">
    <section class="w-full rounded-2xl border border-zinc-800/90 bg-zinc-900/60 p-6 shadow-xl shadow-black/30 ring-1 ring-white/[0.04]">
      <h1 class="text-xl font-bold tracking-tight">모닥 가입</h1>
      <p class="mt-1 text-sm text-zinc-400">이메일, 비밀번호, 이름을 입력해 주세요. 관리자 승인 후 서비스를 이용할 수 있어요.</p>

      <form id="auth-form" class="mt-6 space-y-3" onsubmit="return false;">
        <label class="block">
          <span class="mb-1 block text-2xs text-zinc-500">이메일</span>
          <input id="in-email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-sky-500/70" />
        </label>
        <label class="block">
          <span class="mb-1 block text-2xs text-zinc-500">비밀번호 (6자 이상)</span>
          <input id="in-password" type="password" required minlength="6" autocomplete="new-password" placeholder="비밀번호" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-sky-500/70" />
        </label>
        <label class="block">
          <span class="mb-1 block text-2xs text-zinc-500">이름</span>
          <input id="in-name" type="text" required autocomplete="name" placeholder="프로필에 표시될 이름" class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2.5 text-sm outline-none focus:border-sky-500/70" />
        </label>
        <button id="btn-signup" type="button" class="mt-2 w-full rounded-lg bg-sky-600 py-2.5 text-sm font-semibold text-white hover:bg-sky-500">가입 신청</button>
      </form>
      <p id="auth-msg" class="mt-3 min-h-[1.25rem] text-xs text-zinc-400"></p>
      <p class="mt-4 text-center text-sm text-zinc-500">
        이미 계정이 있으신가요?
        <a href="login.html" class="font-medium text-sky-400 hover:text-sky-300">로그인</a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      function ph(name) {
        return window.MoaSiteEntry && window.MoaSiteEntry.pageHref
          ? window.MoaSiteEntry.pageHref(name)
          : name;
      }
      var msgEl = document.getElementById('auth-msg');
      var c = window.MoaAuth && window.MoaAuth.getClient ? window.MoaAuth.getClient() : null;

      function msg(t, isErr) {
        msgEl.textContent = t || '';
        msgEl.className = 'mt-3 min-h-[1.25rem] text-xs ' + (isErr ? 'text-rose-400' : 'text-zinc-400');
      }

      document.getElementById('btn-signup').addEventListener('click', async function () {
        var email = String(document.getElementById('in-email').value || '').trim();
        var password = String(document.getElementById('in-password').value || '');
        var name = String(document.getElementById('in-name').value || '').trim();
        if (!email || !password || !name) {
          msg('이메일, 비밀번호, 이름을 모두 입력해 주세요.', true);
          return;
        }
        if (password.length < 6) {
          msg('비밀번호는 6자 이상이어야 합니다.', true);
          return;
        }
        if (!c) {
          msg('연결을 초기화하지 못했습니다.', true);
          return;
        }
        msg('가입 처리 중...');
        try {
          var res = await c.auth.signUp({ email: email, password: password });
          if (res.error) throw new Error(res.error.message);
          var user = res.data && res.data.user;
          if (!user) throw new Error('회원 생성 결과를 확인할 수 없습니다.');
          var slug = name.replace(/[^\uac00-\ud7a3a-zA-Z0-9._-]/g, '').slice(0, 20) || 'user';
          var username = slug + '_' + String(user.id).replace(/-/g, '').slice(0, 8);
          await window.MoaAuth.ensureProfileRowIfMissing(user, {
            username: username,
            display_name: name,
          });
          if (window.MoaSiteEntry && window.MoaSiteEntry.markEnteredAfterAuth) {
            window.MoaSiteEntry.markEnteredAfterAuth();
          }
          msg('가입 신청이 완료되었습니다. 관리자 승인 후 이용할 수 있어요.');
          location.replace(ph('pending-approval.html'));
        } catch (e) {
          msg(e.message || '회원가입에 실패했습니다.', true);
        }
      });

      window.MoaAuth.getSessionUser().then(function (u) {
        if (!u || u.is_anonymous) return;
        if (window.MoaSiteEntry && window.MoaSiteEntry.markEnteredAfterAuth) {
          window.MoaSiteEntry.markEnteredAfterAuth();
        }
        window.MoaAuth.getMyProfile().then(function (p) {
          if (window.MoaAuth.isProfileApproved && window.MoaAuth.isProfileApproved(p)) {
            location.replace(ph('project.html'));
            return;
          }
          if (p && p.approval_status === 'rejected') {
            location.replace(ph('pending-approval.html') + '?reason=rejected');
            return;
          }
          location.replace(ph('pending-approval.html'));
        }).catch(function () {
          location.replace(ph('pending-approval.html'));
        });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
